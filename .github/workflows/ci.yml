name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    name: Testes, diagrama UML e teste de fumaça
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes (inclui o teste que confere o diagrama UML com o código)
        run: mvn -B verify
      - name: Teste de fumaça do jar
        run: |
          java -jar target/jornada.jar --jornada.arquivo= &
          for i in $(seq 1 60); do curl -sf http://localhost:5270/health && break; sleep 1; done
          curl -sf http://localhost:5270/ | grep -q "<title>Jornada</title>"
          curl -sf http://localhost:5270/api/ranking | grep -q "Camila Souza"
          curl -sf -X POST http://localhost:5270/api/devs/d2/matriculas/b1/progresso | grep -q '"xpGanho":30'
          curl -sf http://localhost:5270/api/certificados/JRN-D1-B3 | grep -q "Fundamentos de Web"

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t jornada .
      - name: Teste de fumaça do contêiner
        run: |
          docker run -d -p 5270:5270 -v dados:/dados --name escola jornada
          for i in $(seq 1 90); do curl -sf http://localhost:5270/health && break; sleep 1; done
          curl -sf http://localhost:5270/api/bootcamps | grep -q "Java Developer"
          curl -sf -X POST http://localhost:5270/api/devs -H 'Content-Type: application/json' -d '{"nome":"Persistida"}' > /dev/null
          docker restart escola
          for i in $(seq 1 90); do curl -sf http://localhost:5270/health && break; sleep 1; done
          curl -sf http://localhost:5270/api/devs | grep -q "Persistida"
      - if: failure()
        run: docker logs escola
