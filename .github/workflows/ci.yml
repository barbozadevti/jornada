name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    name: Testes, diagrama UML e teste de fumaça
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes (inclui o teste que confere o diagrama UML com o código)
        run: mvn -B verify
      - name: Teste de fumaça do jar (login, papéis e CSRF de verdade)
        run: |
          java -jar target/jornada.jar --jornada.arquivo= &
          for i in $(seq 1 60); do curl -sf http://localhost:5270/health && break; sleep 1; done
          curl -sf http://localhost:5270/ | grep -q "<title>Jornada</title>"
          bash tests/fumaca.sh http://localhost:5270

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t jornada .
      - name: Teste de fumaça do contêiner (e persistência da conta depois de reiniciar)
        run: |
          docker run -d -p 5270:5270 -v dados:/dados --name escola jornada
          for i in $(seq 1 90); do curl -sf http://localhost:5270/health && break; sleep 1; done
          FUMACA_N=777 bash tests/fumaca.sh http://localhost:5270
          docker restart escola
          for i in $(seq 1 90); do curl -sf http://localhost:5270/health && break; sleep 1; done
          JAR=$(mktemp)
          curl -sf -c "$JAR" -b "$JAR" http://localhost:5270/api/auth/csrf > /dev/null
          T=$(grep XSRF-TOKEN "$JAR" | awk '{print $7}' | tail -1)
          curl -sf -c "$JAR" -b "$JAR" -X POST -H "X-XSRF-TOKEN: $T" -H 'Content-Type: application/json' \
            -d '{"email":"aluno777@jornada.dev","senha":"senha-do-aluno"}' http://localhost:5270/api/auth/entrar | grep -q "Aluno 777"
      - if: failure()
        run: docker logs escola
