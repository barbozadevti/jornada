spring.application.name=jornada
server.port=${PORT:5270}

# Onde ficam bootcamps, devs e progresso. Vazio = só na memória (os testes usam assim).
jornada.arquivo=~/.jornada/jornada.json

management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=health

springdoc.swagger-ui.path=/swagger-ui.html

# O atalho liga para abrir o navegador sozinho.
jornada.abrir-navegador=false

# Arquivos do site: o navegador sempre revalida (evita ver telas antigas depois de uma atualização).
spring.web.resources.cache.cachecontrol.no-cache=true
